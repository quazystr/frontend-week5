<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../css/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="counter">
      <button class="counter__button" data-action="decrease" type="button">
        -
      </button>
      <span class="counter__value">0</span>
      <button class="counter__button" data-action="increase" type="button">
        +
      </button>
      <button
        class="counter__button counter__button--reset"
        data-action="reset"
        type="button"
      >
        Сброс
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
